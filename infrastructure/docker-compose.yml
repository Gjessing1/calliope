# Deployment template for Calliope.
#
# The live copy lives at /home/gjessing/docker/calliope/docker-compose.yml with
# its own .env beside it; CI's deploy step runs `docker compose pull && up -d`
# there. This file is the committed reference — keep the two in step.

services:
  calliope:
    image: git.gjessing.io/gjessing1/calliope:latest
    container_name: calliope
    restart: unless-stopped
    ports:
      - '3008:3008'
    environment:
      # Calliope's own state: the SQLite index and the cover cache. Kept OUT of
      # the library directory — that one is watched by Audiobookshelf, and cache
      # files dropped in there make it rescan, or adopt them as book assets.
      CALLIOPE_DATA_DIR: /data
      CALLIOPE_LIBRARY_ROOT: /books
      # Keep <book>.epub.bak beside each book on save. Off by default: the write
      # is already atomic, and a .bak in the library directory is a file
      # Audiobookshelf will also see.
      CALLIOPE_BACKUP_ON_SAVE: 'false'
      # Audiobookshelf integration. Both must be set or ABS is treated as
      # unconfigured; the token comes from ABS → Settings → Users → API Token.
      ABS_URL: http://audiobookshelf:80
      ABS_TOKEN: ${ABS_TOKEN}
      # Where the same library is mounted inside the ABS container — the join
      # key between the two systems is the path below this prefix.
      ABS_BOOKS_ROOT: /books
    volumes:
      # Read-write: this is the whole point, metadata edits land in these files.
      - type: bind
        source: /mnt/data/media/books
        target: /books
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/calliope
        target: /data
        bind:
          create_host_path: false
    networks:
      - calliope

# Audiobookshelf runs from /home/gjessing/docker/audiobookshelf with its own
# compose file. Put both on this external network so Calliope can reach it by
# container name: `docker network create calliope`, then add the network to the
# audiobookshelf service too.
networks:
  calliope:
    external: true
